<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>VocSphere (ボクスフィア) | 大学受験英単語の5次元学習アプリ</title>
    <meta name="description" content="単語は暗記するな、融合せよ。大学受験（共通テスト〜難関大）レベルの英単語680語を、つづり・発音・文脈など5つの角度から完全定着させる次世代学習システム。まずは無料でミッションを開始せよ。">
    <meta name="keywords" content="英単語,大学受験,英語学習アプリ,共通テスト,GMARCH,早慶,VocSphere,ボクスフィア,単語帳,無料">
    <link rel="canonical" href="https://vocsphere.vercel.app/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VocSphere">
    <meta property="og:title" content="VocSphere | 次世代英単語学習システム">
    <meta property="og:description" content="単語は暗記するな、融合せよ。大学受験レベルの重要語680語を、つづり・発音・文脈など5つの次元から完全定着させるSF的学習アプリ。">
    <meta property="og:url" content="https://vocsphere.vercel.app/">
    <meta property="og:image" content="https://vocsphere.vercel.app/images/ogp_card.png">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="VocSphere | 5次元英単語学習">
    <meta name="twitter:description" content="全680語完全無料。あなたの英語脳を覚醒させるミッションを開始せよ。">
    <meta name="twitter:image" content="https://vocsphere.vercel.app/images/ogp_card.png">

    <!-- Hotwire Turbo -->
    <script type="module" src="https://esm.sh/@hotwired/turbo"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-192.png"> 
    <meta name="theme-color" content="#0f172a"> 
    <meta name="google-site-verification" content="yZDx_HvCPiZT8PY9ak1j9DrdbjARdL8xvT2a21WwF1o" />
    <meta name="turbo-cache-control" content="no-cache">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="/data/word_data.js"></script>
    <script src="/js/app.js"></script>

    <style>
        body {
            background-color: #050814;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #050814 80%);
            color: white; font-family: 'Montserrat', 'Zen Kaku Gothic New', sans-serif;
            opacity: 0; transition: opacity 0.3s ease-in-out;
        }
        body.loaded { opacity: 1; }
        
        .glitch {
            text-shadow: 2px 2px #00f2ff, -2px -2px #bd00ff;
            animation: shake 0.5s infinite; 
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            75% { transform: translate(1px, -1px); }
            100% { transform: translate(-1px, 1px); }
        }
        
        /* ABOUTボタンのキラキラアニメーション */
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 200%; }
        }
        .group:hover .group-hover\:animate-shine {
            animation: shine 1s ease-in-out infinite;
        }
        
        /* スクロールバー非表示（でもスクロール可能） */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="module">
      import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics/+esm';
      inject();
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "VocSphere",
      "alternateName": "ボクスフィア",
      "url": "https://vocsphere.vercel.app/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web Browser",
      "description": "大学受験レベルの英単語680語を5つのアスペクトから定着させるWebアプリ。",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "JPY",
        "description": "Completely Free"
      },
      "screenshot": "https://vocsphere.vercel.app/images/hero_cockpit.png"
    }
    </script>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between items-center overflow-y-auto overflow-x-hidden py-8 px-4 no-scrollbar">
    
    <audio id="bgm" src="/audio/bgm.mp3" loop data-turbo-permanent></audio>

    <div class="flex-1 flex flex-col justify-center w-full max-w-md min-h-[30vh]">
        <div class="text-center">
            <div class="text-xs text-cyan-500 tracking-[0.5em] mb-4">TACTICAL VOCABULARY TRAINING</div>
            <h1 class="text-5xl sm:text-6xl md:text-8xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 glitch">
                VocSphere
            </h1>
        </div>
    </div>

    <div class="flex-1 flex flex-col justify-start items-center gap-4 w-full max-w-md py-4">
        
        <!-- ゲストスタート (ローカル保存) -->
        <a href="javascript:startWithoutLogin()" class="group relative px-8 py-3 sm:px-10 sm:py-4 bg-transparent border border-cyan-400 text-cyan-400 font-bold rounded-full shadow-[0_0_15px_rgba(0,242,255,0.2)] hover:bg-cyan-400/10 hover:shadow-[0_0_30px_rgba(0,242,255,0.5)] transition-all duration-300 active:scale-95 cursor-pointer w-full max-w-[280px] text-center">
            <span class="tracking-[0.2em] text-sm sm:text-base">GUEST START</span>
        </a>
        
        <!-- Googleログイン (クラウド保存) -->
        <a href="javascript:loginWithGoogle()" class="group relative px-8 py-3 sm:px-10 sm:py-4 bg-white text-black font-bold rounded-full shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:shadow-[0_0_40px_rgba(255,255,255,0.6)] transition-all duration-300 active:scale-95 cursor-pointer w-full max-w-[280px] text-center">
            <span class="tracking-[0.05em] text-sm sm:text-base flex items-center justify-center gap-2">
                GOOGLE LOGIN
            </span>
        </a>
        
        <!-- データ保存の違いを見るリンク -->
        <button onclick="document.getElementById('save-info-modal').classList.remove('hidden')" class="text-slate-400 text-[10px] sm:text-xs tracking-wider hover:text-cyan-300 transition-colors py-1 mt-1 flex items-center justify-center gap-2 underline underline-offset-4 decoration-slate-600">
            <i class="fas fa-info-circle"></i> SAVE DATA INFO
        </button>

        <div class="mt-4">
            <a href="about.html" class="group relative flex items-center gap-3 px-6 py-2 bg-slate-900/80 border border-cyan-500/50 rounded-full backdrop-blur-md shadow-[0_0_20px_rgba(6,182,212,0.2)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] hover:border-cyan-400 transition-all duration-300 overflow-hidden">
                <div class="absolute top-0 -left-full w-1/2 h-full bg-gradient-to-r from-transparent via-cyan-400/20 to-transparent skew-x-[-20deg] group-hover:animate-shine"></div>
                <div class="w-4 h-4 rounded-full border border-cyan-400 flex items-center justify-center shadow-[0_0_10px_cyan]">
                    <span class="text-cyan-400 text-[10px] font-bold">?</span>
                </div>
                <div class="text-left">
                    <div class="text-[10px] text-cyan-200 tracking-widest font-bold group-hover:text-white transition">ABOUT VOCSPHERE</div>
                </div>
            </a>
        </div>
    </div>

    <div class="flex-none w-full flex flex-col items-center gap-3 pt-2 pb-safe">

        <div class="text-[10px] text-slate-700 font-mono tracking-widest mt-1 text-center mb-4">
            <div>SYSTEM ONLINE v1.0</div>
        </div>
    </div>

    <!-- データ保存形式の違いを説明するモーダル -->
    <div id="save-info-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-slate-900/90 backdrop-blur-sm" onclick="document.getElementById('save-info-modal').classList.add('hidden')"></div>
        <div class="relative bg-slate-800 border border-cyan-500/30 rounded-2xl shadow-[0_0_50px_rgba(6,182,212,0.2)] max-w-sm w-full p-6 sm:p-8 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-purple-600"></div>
            
            <h3 class="text-lg font-bold text-white mb-4 tracking-widest text-center border-b border-slate-700 pb-2 font-mono">SAVE DATA INFO</h3>
            
            <div class="space-y-4 text-sm text-slate-300 jp-font leading-relaxed">
                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 relative overflow-hidden">
                    <div class="absolute left-0 top-0 w-1 h-full bg-cyan-400"></div>
                    <div class="text-cyan-400 font-bold font-mono tracking-wider mb-1 text-xs">GUEST START (Local)</div>
                    <p class="text-[11px] sm:text-xs text-slate-400">端末に学習データを保存します。手軽に始められますが、<span class="text-red-400 font-bold">キャッシュを削除したり、別の端末からアクセスするとデータは引き継がれません。</span></p>
                </div>
                
                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 relative overflow-hidden">
                    <div class="absolute left-0 top-0 w-1 h-full bg-white"></div>
                    <div class="text-white font-bold font-mono tracking-wider mb-1 text-xs flex items-center gap-1">GOOGLE LOGIN (Cloud)</div>
                    <p class="text-[11px] sm:text-xs text-slate-400">Googleアカウントでログインし、クラウドにデータを保存します。スマホとPCなど<span class="text-green-400 font-bold">複数端末でのデータ同期や、確実なバックアップ</span>が可能です。</p>
                </div>
            </div>

            <button onclick="document.getElementById('save-info-modal').classList.add('hidden')" class="mt-6 w-full bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-3 rounded-xl transition tracking-widest">
                CLOSE
            </button>
        </div>
    </div>

</body>
</html>
